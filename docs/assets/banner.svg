  <text x="64" y="64" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B4F38" letter-spacing="3">LOCAL FIRST</text>
  <text x="500" y="160" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#17211c">Scientific Figure Library</text>
  <text x="500" y="208" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#5b675f">Your figures, reviewed and reusable across projects</text>
  <text x="500" y="252" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#5b675f">Import, review, publish locally — then search and materialize in Claude Science or Wisp Science</text>
