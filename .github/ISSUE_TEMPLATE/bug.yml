name: Bug report / 缺陷反馈
description: Report a reproducible SFL problem with sanitized environment information.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issues，并阅读 [用户指南](https://github.com/xuzhougeng/ScientificFigureLibrary/blob/main/docs/USER_GUIDE.zh-CN.md)。
        **不要公开提交漏洞细节、API Key、token、签名私钥、完整环境变量、私有科研数据或原始 Library/locator/receipt。**
        安全问题请先阅读 [安全政策](https://github.com/xuzhougeng/ScientificFigureLibrary/security/policy)。
        本项目遵循 [行为准则](https://github.com/xuzhougeng/ScientificFigureLibrary/blob/main/CODE_OF_CONDUCT.md)。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查 / Before submitting
      options:
        - label: 我已搜索相似问题，并会对日志、路径、附件和复现数据进行脱敏。
          required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: 当前行为 / Actual behavior
      description: 描述实际观察到的结果，不必推测根因。
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: 期望行为 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: 复现步骤 / Reproduction steps
      description: 使用编号步骤，说明初始绑定状态、操作顺序和问题出现的位置；不要粘贴真实私有目录。
    validations:
      required: true
  - type: textarea
    id: minimal_reproduction
    attributes:
      label: 最小复现 / Minimal reproduction
      description: 提供脱敏代码、公开最小仓库或合成数据。无法提供时，请说明原因；不要上传完整 Library。
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: 操作系统 / Operating system
      options: [Windows, macOS, Linux, WSL, Other]
    validations:
      required: true
  - type: input
    id: operating_system_version
    attributes:
      label: 系统版本 / OS version
      description: WSL 请同时说明发行版和 Windows 版本。
    validations:
      required: true
  - type: input
    id: host_version
    attributes:
      label: 宿主及版本 / Host and version
      placeholder: Wisp / Codex / Claude / Cursor / other MCP host, version ...
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js 版本 / Node.js version
      description: 填写 node --version 的结果；无法获取时明确说明。
    validations:
      required: true
  - type: input
    id: sfl_version
    attributes:
      label: SFL 版本 / SFL version
      description: Release 版本、插件版本或源码 commit。
    validations:
      required: true
  - type: dropdown
    id: installation_method
    attributes:
      label: 安装方式 / Installation method
      options: [GitHub Release ZIP, Source checkout, npm package or tarball, Other]
    validations:
      required: true
  - type: textarea
    id: dependency_versions
    attributes:
      label: 相关依赖版本 / Relevant dependency versions
      description: 源码问题请列相关依赖；普通插件使用者可填写“不适用”。不要提交包含凭据的 npm 配置。
    validations:
      required: true
  - type: input
    id: affected_area
    attributes:
      label: Provider 与操作阶段 / Provider and operation
      placeholder: Local Published / FigureYa / Open Figure Modules; bind / search / preview / materialize ...
    validations:
      required: true
  - type: textarea
    id: error_logs
    attributes:
      label: 脱敏错误日志 / Sanitized error logs
      description: 保留相关错误链；删除凭据、个人数据和敏感路径。没有日志或不能提供时说明原因。
      render: text
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: 复现频率 / Reproducibility
      options: [Always / 总是, Intermittent / 偶发, Once / 仅一次, Not yet verified / 尚未确认]
    validations:
      required: true
  - type: dropdown
    id: willingness_to_help
    attributes:
      label: 是否愿意协助 / Willingness to help
      options: [Provide more information / 补充信息, Verify a fix / 验证修复, Contribute a fix / 提交实现, Not at this time / 暂不方便]
    validations:
      required: true
  - type: input
    id: optional_contact
    attributes:
      label: 可选联系方式 / Optional contact
      description: 默认通过 GitHub 回复。不要填写私密邮箱或其他不愿公开的信息。
