name: Question / 使用咨询
description: Ask about a workflow after checking the user guide.
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [用户指南](https://github.com/xuzhougeng/ScientificFigureLibrary/blob/main/docs/USER_GUIDE.zh-CN.md)，搜索现有 Issues，并遵循 [行为准则](https://github.com/xuzhougeng/ScientificFigureLibrary/blob/main/CODE_OF_CONDUCT.md)。
        不要提交私有数据、token 或 API Key。安全问题请先阅读 [安全政策](https://github.com/xuzhougeng/ScientificFigureLibrary/security/policy)。
  - type: textarea
    id: goal
    attributes:
      label: 想完成的任务 / Goal
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: 已经尝试的方法 / What you tried
      description: 包含已查阅的文档和已执行的操作。
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual_result
    attributes:
      label: 实际结果 / Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境与版本 / Environment and versions
      description: 操作系统、宿主、SFL 和 Node.js 版本；无法获取的项说明原因。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 相关代码或日志 / Relevant code or logs
      description: 仅提供脱敏内容；没有相关内容时填写“不适用”。
    validations:
      required: true
  - type: dropdown
    id: suspected_bug
    attributes:
      label: 是否可能是 Bug / Could this be a bug?
      options: [Unsure / 不确定, Yes / 可能是, No / 使用咨询]
    validations:
      required: true
