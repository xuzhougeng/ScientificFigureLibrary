name: Read-only npm authentication diagnostic

on:
  # Deliberately isolated to this explicitly authorized diagnostic branch.
  # Do not add a pull_request trigger or merge this temporary entrypoint to main.
  push:
    branches: [codex/npm-publish-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.repository == 'xuzhougeng/ScientificFigureLibrary' && github.ref == 'refs/heads/codex/npm-publish-diagnostics' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check existing credential without displaying it or attempting publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIAGNOSTICS_REPORT: ${{ runner.temp }}/sfl-npm-auth/report.json
        run: node .github/scripts/npm-diagnostics.cjs
      - name: Preserve only the sanitized diagnostic report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-auth-diagnostic
          path: ${{ runner.temp }}/sfl-npm-auth/report.json
          if-no-files-found: warn
          retention-days: 7
