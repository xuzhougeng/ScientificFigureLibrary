name: SFL CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: sfl-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  CI: "true"
  SFL_OPEN_FIGURE_AUTO_REFRESH: "0"

defaults:
  run:
    shell: pwsh

jobs:
  quality:
    name: SFL / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check synchronized versions
        run: npm run version:check
      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Offline automation security and workflow tests
        run: node --test .github/tests/*.test.cjs
      - name: Check documentation links
        run: npm run docs:check-links
      - name: Check collaboration documentation links
        run: node scripts/check-doc-links.mjs AGENTS.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md docs/GITHUB_AUTOMATION.md .github/pull_request_template.md
      - name: Check whitespace in changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if ($env:BASE_SHA -match '^[0-9a-f]{40}$' -and $env:BASE_SHA -notmatch '^0{40}$') {
            git diff --check $env:BASE_SHA $env:GITHUB_SHA
          } else {
            git show --format= --check HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test-build:
    name: SFL / Test build smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: windows-latest
            node: "24"
          - os: macos-latest
            node: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Isolate application state
        run: |
          $root = Join-Path $env:RUNNER_TEMP "sfl-ci-state"
          $paths = @{
            XDG_CONFIG_HOME = Join-Path $root "config"
            XDG_CACHE_HOME = Join-Path $root "cache"
            APPDATA = Join-Path $root "appdata"
            LOCALAPPDATA = Join-Path $root "localappdata"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            New-Item -ItemType Directory -Force -Path $entry.Value | Out-Null
            "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          New-Item -ItemType Directory -Force -Path reports | Out-Null
      - name: Run unit and integration tests
        run: |
          npm test 2>&1 | Tee-Object -FilePath reports/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run MCP smoke
        run: |
          npm run test:smoke 2>&1 | Tee-Object -FilePath reports/smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_attempt }}
          path: reports/*.log
          if-no-files-found: warn
          retention-days: 14

  packages:
    name: SFL / Packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Package all four hosts
        run: npm run package:plugins
      - name: Package npm tarball
        run: npm run package:npm
      - name: Upload CI-only package candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/scientific-figure-library-*.zip
            release/scientific-figure-library-*.zip.sha256
            release/scientific-figure-library-*.tgz
            release/scientific-figure-library-*.tgz.sha256
            release/scientific-figure-library-wisp-update.json
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: SFL / Dependency audit baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Explicitly advisory until existing vulnerabilities and exceptions are reviewed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Audit locked dependencies
        run: npm audit --audit-level=high

  ci-required:
    name: SFL / CI required
    if: ${{ always() }}
    needs: [quality, test-build, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          $results = $env:RESULTS | ConvertFrom-Json
          foreach ($job in $results.PSObject.Properties) {
            if ($job.Value.result -ne "success") {
              Write-Error "$($job.Name): $($job.Value.result)"
              exit 1
            }
          }
