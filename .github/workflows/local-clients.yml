name: Local client installers

on:
  push:
    branches: [main, 'codex/local-client-*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or tag to package
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: local-clients-${{ github.ref }}
  cancel-in-progress: true

env:
  SFL_OPEN_FIGURE_AUTO_REFRESH: '0'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/windows/shell/go.mod
          cache-dependency-path: desktop/windows/shell/go.sum
      - run: npm ci
      - run: npm run build
      - name: Test the desktop shell
        working-directory: desktop/windows/shell
        run: |
          go vet ./...
          go test ./...
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw "Inno Setup installer hash mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
          "SFL_ISCC=$(Join-Path $dir 'ISCC.exe')" >> $env:GITHUB_ENV
      - run: node scripts/package-local-client.mjs windows-x64 --installer
      - run: node scripts/package-local-client.mjs windows-x64 --system-node
      - name: Verify ZIPs and both runtime modes
        shell: pwsh
        run: |
          foreach ($archive in Get-ChildItem release/local-client/*windows-x64*.zip) {
            node scripts/smoke-local-package.mjs $archive.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/smoke-packaged-local.mjs $archive.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify the installer installs, upgrades and uninstalls
        shell: pwsh
        run: |
          foreach ($setup in Get-ChildItem release/local-client/*windows-x64-setup.exe) {
            node scripts/smoke-windows-installer.mjs $setup.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-local-client
          path: |
            release/local-client/*.zip
            release/local-client/*.exe
            release/local-client/*.sha256
          compression-level: 0
          if-no-files-found: error
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-local-client.mjs linux-${{ matrix.architecture }}
      - run: node scripts/package-local-client.mjs linux-${{ matrix.architecture }} --system-node
      - name: Verify ZIPs and both runtime modes
        run: |
          for archive in release/local-client/*linux-${{ matrix.architecture }}*.zip; do
            node scripts/smoke-local-package.mjs "$archive"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ matrix.architecture }}-local-client
          path: |
            release/local-client/*.zip
            release/local-client/*.sha256
          compression-level: 0
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-14
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build native App, run native smoke, and create architecture-specific DMG
        run: |
          node scripts/package-local-client.mjs macos-${{ matrix.architecture }}
          node scripts/package-local-client.mjs macos-${{ matrix.architecture }} --system-node
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.architecture }}-local-client
          path: |
            release/local-client/*.dmg
            release/local-client/*.sha256
          compression-level: 0
          if-no-files-found: error
